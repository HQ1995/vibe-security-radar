name: Deploy Pages (manual, from Neon)

on:
  # Pushes deploy through the Cloudflare Pages Git integration, which builds the
  # committed generated data in a build container that has no Neon credentials.
  # This workflow is the only path that republishes from Neon, so it stays
  # manual: a dispatch is the signal that spending the metered read is intended.
  # Do not add a push trigger back.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: python -m pip install pytest
      - name: Install neon deps
        run: python -m pip install -r ../scripts/requirements-neon.txt
      - name: Publish catalog from Neon
        # Reads the committed jsonl export while its sha256 still matches the
        # Neon digest, so an unchanged catalog costs one query.
        run: python3 ../scripts/publish_tp_ledger.py --prefer-export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL }}
      - name: Build
        run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy out --project-name vibe-security-radar --branch main
