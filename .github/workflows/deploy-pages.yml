name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: python -m pip install pytest
      - name: Install neon deps
        run: python -m pip install -r ../scripts/requirements-neon.txt
      - name: Publish catalog from Neon
        # Neon free tier is metered. Push deploys build the committed
        # generated data; only a manual dispatch republishes from Neon.
        if: github.event_name == 'workflow_dispatch'
        run: python3 ../scripts/publish_tp_ledger.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL }}
      - name: Build
        run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy out --project-name vibe-security-radar --branch main
